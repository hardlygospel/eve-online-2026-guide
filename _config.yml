title: EVE Online Guide 2026
description: The most comprehensive EVE Online guide for 2026 — races, ISK methods, progression, fittings, shortcuts, tools and more.
remote_theme: just-the-docs/just-the-docs

color_scheme: dark
search_enabled: true
permalink: pretty

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "EVE Online Guide 2026 &mdash; <a href='https://hardlygospel.github.io'>hardlygospel.github.io</a>"

aux_links:
  "← Homepage":
    - "https://hardlygospel.github.io"
  "GitHub":
    - "https://github.com/hardlygospel/eve-online-2026-guide"

aux_links_new_tab: true

callouts_level: quiet
callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

kramdown:
  parse_block_html: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
